<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topplista · Tablehopp</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#bfe2f1">
<link rel="icon" href="/assets/img/tablehopp-logo-email.png">
<style>
  @font-face{font-family:'Boldonse';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/Boldonse-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#bfe2f1;background-image:linear-gradient(176deg,#cdeafa 0%,#bfe2f1 45%,#a9d6ec 100%);min-height:100vh;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:#191919;-webkit-font-smoothing:antialiased;
    padding:28px 16px 64px}
  .wrap{max-width:560px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .back{font-size:14px;font-weight:600;color:#191919;text-decoration:none;opacity:.8}
  .back:hover{opacity:1}
  .lang{display:flex;gap:1px;align-items:center;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(25,25,25,.12);font-size:12.5px;font-weight:600}
  .lang button{appearance:none;-webkit-appearance:none;background:none;border:0;cursor:pointer;font:inherit;padding:4px 10px;border-radius:999px;color:rgba(25,25,25,.5);line-height:1}
  .lang button.on{color:#191919;background:#fff;box-shadow:0 1px 3px rgba(25,25,25,.16)}
  .hero{text-align:center;margin:6px 0 26px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#1c4a63;margin:0 0 12px;display:flex;gap:7px;align-items:center;justify-content:center}
  .live{display:inline-flex;align-items:center;gap:6px}
  .live .dot{width:8px;height:8px;border-radius:50%;background:#1fae54;box-shadow:0 0 0 0 rgba(31,174,84,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,174,84,.55)}70%{box-shadow:0 0 0 9px rgba(31,174,84,0)}100%{box-shadow:0 0 0 0 rgba(31,174,84,0)}}
  h1{font-family:'Boldonse',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(30px,8vw,46px);line-height:1.04;letter-spacing:.01em;margin:0 0 14px}
  .sub{font-size:16px;line-height:1.55;color:#15384a;margin:0 auto;max-width:430px}
  .sub b{background:#EEFF2E;padding:0 .14em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .card{background:#fff;border:2px solid #191919;border-radius:18px;box-shadow:7px 7px 0 #191919;padding:20px;margin:0 0 20px}
  .you{background:#efdf5c}
  .you .ylabel{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
  .yrow{display:flex;align-items:center;gap:16px}
  .yrank{font-family:'Boldonse',sans-serif;font-size:34px;line-height:1;white-space:nowrap}
  .ymeta{flex:1;min-width:0}
  .ymeta .big{font-size:20px;font-weight:800;margin:0 0 2px}
  .ymeta .small{font-size:13.5px;color:#3a3320;margin:0}
  .linkbox{display:flex;gap:8px;margin-top:16px}
  .linkbox input{flex:1;min-width:0;font:inherit;font-size:13px;font-weight:600;border:2px solid #191919;border-radius:10px;padding:10px 12px;background:#fff;color:#191919}
  .btn{appearance:none;-webkit-appearance:none;cursor:pointer;font:inherit;font-weight:800;font-size:14px;border:2px solid #191919;border-radius:10px;padding:10px 16px;background:#191919;color:#fff;white-space:nowrap;box-shadow:3px 3px 0 rgba(25,25,25,.25)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(25,25,25,.25)}
  .btn.copied{background:#1fae54;border-color:#15833f}
  .listhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
  .listhead .t{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .listhead .u{font-size:12px;color:#1c4a63;opacity:.85}
  ol.board{list-style:none;margin:0;padding:0}
  ol.board li{display:flex;align-items:center;gap:14px;padding:13px 8px;border-bottom:1.5px solid #e4eef4}
  ol.board li:last-child{border-bottom:0}
  ol.board li.me{background:#fffbe6;border-radius:10px;margin:2px 0;border-bottom:1.5px solid #efe3a8}
  .rk{font-weight:800;font-size:16px;width:40px;text-align:center;flex:none}
  .rk.medal{font-size:22px}
  .nm{flex:1;font-weight:700;font-size:16px;letter-spacing:.04em}
  .ct{font-weight:800;font-size:16px}
  .ct span{font-weight:600;font-size:13px;color:#6a7c86}
  .empty{text-align:center;color:#3a5663;font-size:15px;padding:18px 6px}
  .cta{display:block;text-align:center;background:#efdf5c;color:#191919;border:2px solid #191919;border-radius:12px;box-shadow:4px 4px 0 #191919;padding:14px;font-weight:800;text-decoration:none;font-size:16px;margin-top:6px}
  .foot{text-align:center;font-size:12px;color:#4a6b7a;margin-top:26px}
  .skel{color:#7c98a6}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="/" id="backLink">← tablehopp.app</a>
    <div class="lang" translate="no"><button type="button" data-l="sv">SV</button><button type="button" data-l="en">EN</button></div>
  </div>

  <div class="hero">
    <p class="eyebrow"><span class="live"><span class="dot"></span><span id="liveLbl">LIVE</span></span> · <span id="eyebrow2">TOPPLISTA</span></p>
    <h1 id="title">Topplista</h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="card you" id="youCard" style="display:none">
    <p class="ylabel" id="youLabel">Din placering</p>
    <div class="yrow">
      <div class="yrank" id="youRank">—</div>
      <div class="ymeta">
        <p class="big" id="youBig">—</p>
        <p class="small" id="youSmall"></p>
      </div>
    </div>
    <div class="linkbox">
      <input id="youLink" readonly value="">
      <button class="btn" id="copyBtn" type="button">Kopiera</button>
    </div>
  </div>

  <div class="card">
    <div class="listhead">
      <span class="t" id="boardTitle">Topp 10</span>
      <span class="u" id="updated"></span>
    </div>
    <ol class="board" id="board"><li class="empty skel" id="boardLoading">…</li></ol>
    <a class="cta" id="joinCta" href="/" style="display:none">Gå med i väntelistan →</a>
  </div>

  <p class="foot">Tablehopp · cykelfesten · tablehopp.app</p>
</div>

<script>
(function(){
  "use strict";
  var SUPABASE_URL="https://sjesxyievpxkcmsunjfp.supabase.co";
  var SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqZXN4eWlldnB4a2Ntc3VuamZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNzgyODQsImV4cCI6MjA5Nzg1NDI4NH0.tEedczjLIWZgXl0RMOjT8c-3z8V6HAH1_9rioD3zPPw";
  var SITE="https://tablehopp.app";

  var lang=(function(){var l=null;try{l=localStorage.getItem("thlang");}catch(e){}
    if(l==="en"||l==="sv")return l;var n=(navigator.language||"sv").toLowerCase();return /^en/.test(n)?"en":"sv";})();
  var ref=(function(){var r="";try{var m=location.search.match(/[?&]ref=([^&]+)/);if(m)r=decodeURIComponent(m[1]);}catch(e){}
    try{if(!r)r=localStorage.getItem("thref")||"";}catch(e){}
    return (r||"").replace(/[^a-zA-Z0-9]/g,"").slice(0,40);})();

  var T={
    sv:{title:"Topplista",eyebrow:"Topplista",live:"LIVE",
      sub:'Värva flest vänner till väntelistan. Den som toppar kör sin <b>första cykelfest gratis</b>.',
      you:"Din placering",board:"Topp 10",updated:"Uppdaterad",justnow:"nyss",
      copy:"Kopiera",copied:"Kopierad!",yourlink:"Din länk",
      ref1:"värvning",refN:"värvningar",
      norank:"Dela din länk för att ta dig in på listan.",
      rankline:function(r,t){return "Du är #"+r+" av "+t+" som värvat.";},
      empty:"Ingen har värvat någon än — bli den första!",
      joincta:"Gå med i väntelistan →",
      nocode:"Gå med i väntelistan så får du din egen länk att dela.",
      back:"← tablehopp.app",err:"Kunde inte ladda topplistan just nu. Försök igen strax."},
    en:{title:"Leaderboard",eyebrow:"Leaderboard",live:"LIVE",
      sub:'Refer the most friends to the waitlist. Whoever tops it runs their <b>first dinner free</b>.',
      you:"Your spot",board:"Top 10",updated:"Updated",justnow:"just now",
      copy:"Copy",copied:"Copied!",yourlink:"Your link",
      ref1:"referral",refN:"referrals",
      norank:"Share your link to get on the board.",
      rankline:function(r,t){return "You're #"+r+" of "+t+" referrers.";},
      empty:"No one has referred anyone yet — be the first!",
      joincta:"Join the waitlist →",
      nocode:"Join the waitlist to get your own link to share.",
      back:"← tablehopp.app",err:"Couldn't load the leaderboard right now. Try again shortly."}
  }[lang];

  function $(id){return document.getElementById(id);}
  document.documentElement.lang=lang;
  $("title").textContent=T.title;
  $("eyebrow2").textContent=T.eyebrow.toUpperCase();
  $("liveLbl").textContent=T.live;
  $("sub").innerHTML=T.sub;
  $("boardTitle").textContent=T.board;
  $("youLabel").textContent=T.you;
  $("copyBtn").textContent=T.copy;
  $("joinCta").textContent=T.joincta;
  $("backLink").textContent=T.back;
  var qsLang=lang==="en"?"?lang=en":"";
  $("backLink").href="/"+qsLang;
  $("joinCta").href="/"+qsLang;

  // language toggle
  var lb=document.querySelector(".lang");
  [].forEach.call(lb.querySelectorAll("button"),function(b){b.classList.toggle("on",b.getAttribute("data-l")===lang);});
  lb.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");if(!b)return;var l=b.getAttribute("data-l");if(l===lang)return;try{localStorage.setItem("thlang",l);}catch(e){}location.reload();});

  function refsWord(n){return n===1?T.ref1:T.refN;}
  function medal(r){return r===1?"🥇":r===2?"🥈":r===3?"🥉":("#"+r);}

  // personal "you" card
  if(ref){
    $("youCard").style.display="block";
    var link=SITE+"/?ref="+encodeURIComponent(ref);
    $("youLink").value=link;
    var copyBtn=$("copyBtn");
    copyBtn.addEventListener("click",function(){
      var done=function(){copyBtn.textContent=T.copied;copyBtn.classList.add("copied");setTimeout(function(){copyBtn.textContent=T.copy;copyBtn.classList.remove("copied");},1600);};
      if(navigator.share&&/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){navigator.share({title:"Tablehopp",url:link}).then(function(){},function(){});}
      try{navigator.clipboard.writeText(link).then(done,function(){fallbackCopy();});}catch(e){fallbackCopy();}
      function fallbackCopy(){var i=$("youLink");i.focus();i.select();try{document.execCommand("copy");done();}catch(e){}}
    });
  } else {
    $("youCard").style.display="none";
    $("joinCta").style.display="block";
  }

  function rpc(fn,body){
    return fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",
      headers:{"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,"Content-Type":"application/json"},
      body:JSON.stringify(body||{})}).then(function(r){return r.ok?r.json():null;});
  }

  function renderBoard(rows){
    var ol=$("board");
    if(!rows||!rows.length){ ol.innerHTML='<li class="empty">'+T.empty+'</li>'; return; }
    var html="";
    rows.forEach(function(row){
      var r=+row.rank, n=+row.referrals, mine=(myRank&&r===myRank);
      html+='<li class="'+(mine?"me":"")+'">'
        +'<span class="rk'+(r<=3?" medal":"")+'">'+medal(r)+'</span>'
        +'<span class="nm">'+esc(row.handle||"")+(mine?' · '+(lang==="en"?"you":"du"):"")+'</span>'
        +'<span class="ct">'+n+' <span>'+refsWord(n)+'</span></span>'
        +'</li>';
    });
    ol.innerHTML=html;
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

  var myRank=0;
  function renderYou(rank,refsN,total){
    if(!ref)return;
    $("youRank").textContent=rank?("#"+rank):"—";
    $("youBig").textContent=refsN+" "+refsWord(refsN);
    $("youSmall").textContent=rank?T.rankline(rank,total):T.norank;
    myRank=rank||0;
  }

  function stamp(){
    try{var d=new Date();var hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
      $("updated").textContent=T.updated+" "+hh+":"+mm;}catch(e){$("updated").textContent=T.updated+" "+T.justnow;}
  }

  function load(){
    var jobs=[rpc("get_leaderboard",{top_n:10})];
    if(ref)jobs.push(rpc("get_referral_rank",{code:ref}));
    Promise.all(jobs).then(function(res){
      var board=res[0];
      if(ref){var me=res[1]&&res[1][0];if(me)renderYou(+me.referrals||0,me.rank?+me.rank:0,+me.total_referrers||0);else renderYou(0,0,0);}
      if(board===null){ if($("boardLoading"))$("board").innerHTML='<li class="empty">'+T.err+'</li>'; return; }
      renderBoard(board);
      stamp();
    }).catch(function(){ if($("boardLoading"))$("board").innerHTML='<li class="empty">'+T.err+'</li>'; });
  }

  load();
  // poll so the board feels live; pause when the tab is hidden
  setInterval(function(){ if(!document.hidden) load(); },12000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
})();
</script>
</body>
</html>
