<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topplista · Tablehopp</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#bfe2f1">
<link rel="icon" href="/assets/img/tablehopp-logo-email.png">
<style>
  /* Brand type — same families as the site */
  @font-face{font-family:'Boldonse';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/Boldonse-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Geist';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/gyByhwUxId8gMEwcGFU.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Geist';font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/gyByhwUxId8gMEwcGFU.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Geist';font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/gyByhwUxId8gMEwcGFU.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Geist';font-style:normal;font-weight:700;font-display:swap;src:url(/assets/fonts/gyByhwUxId8gMEwcGFU.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  :root{--ink:#191919;--accent:#efdf5c;--green:#a1e9a1;--silver:#dde7ee;--paper:#fff;--muted:#5a7686;--cr:16px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#bfe2f1;background-image:linear-gradient(180deg,#cfeaf9 0%,#bfe2f1 55%,#aed9ee 100%);min-height:100vh;
    font-family:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    padding:24px 18px 72px}
  .wrap{max-width:540px;margin:0 auto}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
  .back{font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;opacity:.75}
  .back:hover{opacity:1}
  .lang{display:flex;gap:1px;align-items:center;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(25,25,25,.12);font-size:12.5px;font-weight:600}
  .lang button{appearance:none;-webkit-appearance:none;background:none;border:0;cursor:pointer;font:inherit;padding:4px 10px;border-radius:999px;color:rgba(25,25,25,.5);line-height:1}
  .lang button.on{color:var(--ink);background:#fff;box-shadow:0 1px 3px rgba(25,25,25,.16)}

  .hero{text-align:center;margin:4px 0 28px}
  h1{font-family:'Boldonse',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(32px,9vw,52px);line-height:1.02;letter-spacing:-.02em;margin:0 0 16px}
  .sub{font-size:16px;line-height:1.6;color:#1d4253;margin:0 auto;max-width:420px;font-weight:500}
  .sub b{font-weight:500;background:#EEFF2E;padding:.02em .18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

  .card{background:var(--paper);border:2px solid var(--ink);border-radius:var(--cr);box-shadow:6px 6px 0 var(--ink);padding:22px;margin:0 0 22px}

  /* your spot */
  .you .ylabel{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  .yrow{display:flex;align-items:center;gap:18px}
  .ybadge{flex:none;width:64px;height:64px;border-radius:16px;background:var(--accent);border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-family:'Boldonse',sans-serif;font-size:22px;box-shadow:3px 3px 0 var(--ink)}
  .ymeta{flex:1;min-width:0}
  .ymeta .big{font-size:21px;font-weight:700;margin:0 0 3px}
  .ymeta .small{font-size:14px;color:var(--muted);margin:0;font-weight:500}
  .linkrow{display:flex;gap:10px;margin-top:18px}
  .linkfield{flex:1;min-width:0;display:flex;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;
    box-shadow:4px 4px 0 var(--ink);transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s cubic-bezier(.34,1.56,.64,1)}
  .linkfield:focus-within{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .linkfield input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--ink);padding:11px 14px}
  .btn{appearance:none;-webkit-appearance:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;border:2px solid var(--ink);
    border-radius:12px;padding:0 18px;height:48px;background:var(--accent);color:var(--ink);white-space:nowrap;
    transition:transform .15s ease,filter .2s ease}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
  .btn:active{transform:translateY(1px)}
  .btn.copied{background:var(--green)}

  /* share */
  .you .linkfield{margin-top:16px}
  .sharebtn{display:block;width:100%;margin-top:12px;appearance:none;-webkit-appearance:none;cursor:pointer;
    font-family:inherit;font-weight:700;font-size:17px;border:2px solid var(--ink);border-radius:12px;padding:15px;
    background:var(--accent);color:var(--ink);box-shadow:4px 4px 0 var(--ink);
    transition:transform .15s ease,box-shadow .15s ease,background .2s ease}
  .sharebtn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
  .sharebtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .sharebtn.done{background:var(--green)}
  .chans{display:flex;gap:8px;margin-top:10px}
  .chan{flex:1;text-align:center;appearance:none;-webkit-appearance:none;cursor:pointer;font-family:inherit;
    font-weight:600;font-size:13.5px;border:2px solid var(--ink);border-radius:10px;padding:11px 4px;
    background:#fff;color:var(--ink);text-decoration:none;transition:transform .12s ease,background .2s ease}
  .chan:hover{transform:translateY(-1px)}
  .chan:active{transform:translateY(1px)}
  .chan.copied{background:var(--green)}
  .sharehint{min-height:18px;margin:12px 2px 0;font-size:13.5px;font-weight:600;color:#1d7a3a;text-align:center}

  /* board */
  .listhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
  .listhead .t{font-family:'Boldonse',sans-serif;font-size:14px;letter-spacing:.01em;text-transform:uppercase}
  .listhead .u{font-size:12px;color:var(--muted);font-weight:500}
  ol.board{list-style:none;margin:0;padding:0}
  ol.board li{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1.5px solid #eef4f8}
  ol.board li:last-child{border-bottom:0}
  ol.board li.me{background:#fffbe8;border:2px solid var(--ink);border-radius:12px;padding:13px 12px;margin:6px 0}
  /* rank number — the site's outlined Boldonse numeral (transparent fill + stroke) */
  .rk{flex:none;width:56px;text-align:center;font-family:'Boldonse',sans-serif;font-weight:400;font-size:26px;line-height:1;
    letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px var(--ink);text-stroke:1.5px var(--ink);opacity:.45}
  .rk.top{opacity:1}
  .nm{flex:1;min-width:0;font-weight:600;font-size:16px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm em{font-style:normal;display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--ink);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:1px}
  .ct{flex:none;font-weight:700;font-size:17px}
  .ct span{font-weight:500;font-size:13px;color:var(--muted);margin-left:4px}
  .empty{text-align:center;color:#3a5663;font-size:15px;padding:22px 6px;font-weight:500}
  .cta{display:block;text-align:center;background:var(--accent);color:var(--ink);border:2px solid var(--ink);border-radius:12px;
    box-shadow:4px 4px 0 var(--ink);padding:15px;font-weight:700;text-decoration:none;font-size:16px;margin-top:6px;
    transition:transform .15s ease}
  .cta:hover{transform:translate(1px,1px)}
  .foot{text-align:center;font-size:12px;color:#557282;margin-top:30px;font-weight:500}
</style>
	<!-- Vercel Web Analytics -->
	<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="/" id="backLink">← tablehopp.app</a>
    <div class="lang" translate="no"><button type="button" data-l="sv">SV</button><button type="button" data-l="en">EN</button></div>
  </div>

  <div class="hero">
    <h1 id="title">Topplista</h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="card you" id="youCard" style="display:none">
    <p class="ylabel" id="youLabel">Din placering</p>
    <div class="yrow">
      <div class="ybadge" id="youRank">—</div>
      <div class="ymeta">
        <p class="big" id="youBig">—</p>
        <p class="small" id="youSmall"></p>
      </div>
    </div>
    <div class="linkfield"><input id="youLink" readonly value=""></div>
    <button class="sharebtn" id="shareBtn" type="button">Dela din länk</button>
    <div class="chans">
      <a class="chan" id="waBtn" target="_blank" rel="noopener">WhatsApp</a>
      <a class="chan" id="smsBtn">SMS</a>
      <a class="chan" id="mailBtn">Mejl</a>
      <button class="chan" id="copyBtn" type="button">Kopiera</button>
    </div>
    <p class="sharehint" id="shareHint" aria-live="polite"></p>
  </div>

  <div class="card">
    <div class="listhead">
      <span class="t" id="boardTitle">Topp 10</span>
      <span class="u" id="updated"></span>
    </div>
    <ol class="board" id="board"><li class="empty" id="boardLoading">…</li></ol>
    <a class="cta" id="joinCta" href="/" style="display:none">Gå med i väntelistan →</a>
  </div>

  <p class="foot" id="foot">Tablehopp · cykelfesten · tablehopp.app</p>
</div>

<script>
(function(){
  "use strict";
  var SUPABASE_URL="https://sjesxyievpxkcmsunjfp.supabase.co";
  var SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqZXN4eWlldnB4a2Ntc3VuamZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNzgyODQsImV4cCI6MjA5Nzg1NDI4NH0.tEedczjLIWZgXl0RMOjT8c-3z8V6HAH1_9rioD3zPPw";
  var SITE="https://tablehopp.app";

  var lang=(function(){var l=null;try{l=localStorage.getItem("thlang");}catch(e){}
    if(l==="en"||l==="sv")return l;var n=(navigator.language||"sv").toLowerCase();return /^en/.test(n)?"en":"sv";})();
  var ref=(function(){var r="";try{var m=location.search.match(/[?&]ref=([^&]+)/);if(m)r=decodeURIComponent(m[1]);}catch(e){}
    try{if(!r)r=localStorage.getItem("thref")||"";}catch(e){}
    return (r||"").replace(/[^a-zA-Z0-9]/g,"").slice(0,40);})();

  var T={
    sv:{title:"Topplista",live:"Live",
      sub:'Värva flest vänner till väntelistan. Den som toppar kör sin <b>första cykelfest gratis</b>.',
      you:"Din placering",board:"Topp 10",updated:"Uppdaterad",
      copy:"Kopiera",copied:"Kopierad!",ref1:"värvning",refN:"värvningar",
      share:"Dela din länk",shared:"Delad! ✓",chMail:"Mejl",
      shareMsg:"Jag har gått med i Tablehopps väntelista — en cykelfest där gänget cyklar runt och äter förrätt, varmrätt och efterrätt hos olika grannar. Häng med:",
      mailSubj:"Häng med på Tablehopp 🚲",
      norank:"Dela din länk för att ta dig in på listan.",
      rankline:function(r,t){return "Du är #"+r+" av "+t+" som värvat.";},
      empty:"Ingen har värvat någon än — bli den första!",
      joincta:"Gå med i väntelistan →",
      back:"← tablehopp.app",err:"Kunde inte ladda topplistan just nu. Försök igen strax.",me:"du"},
    en:{title:"Leaderboard",live:"Live",
      sub:'Refer the most friends to the waitlist. Whoever tops it runs their <b>first progressive dinner free</b>.',
      you:"Your spot",board:"Top 10",updated:"Updated",
      copy:"Copy",copied:"Copied!",ref1:"referral",refN:"referrals",
      share:"Share your link",shared:"Shared! ✓",chMail:"Email",
      shareMsg:"I just joined the Tablehopp waitlist — a progressive dinner on bikes where the crew bikes between neighbors for the starter, main and dessert. Come along:",
      mailSubj:"Come join Tablehopp 🚲",
      norank:"Share your link to get on the board.",
      rankline:function(r,t){return "You're #"+r+" of "+t+" referrers.";},
      empty:"No one has referred anyone yet — be the first!",
      joincta:"Join the waitlist →",
      back:"← tablehopp.app",err:"Couldn't load the leaderboard right now. Try again shortly.",me:"you",
      foot:"Tablehopp · the progressive dinner · tablehopp.app"}
  }[lang];

  function $(id){return document.getElementById(id);}
  document.documentElement.lang=lang;
  $("title").textContent=T.title;
  $("sub").innerHTML=T.sub;
  $("boardTitle").textContent=T.board;
  $("youLabel").textContent=T.you;
  $("copyBtn").textContent=T.copy;
  $("shareBtn").textContent=T.share;
  $("waBtn").textContent="WhatsApp";
  $("smsBtn").textContent="SMS";
  $("mailBtn").textContent=T.chMail;
  $("joinCta").textContent=T.joincta;
  $("backLink").textContent=T.back;
  if(T.foot)$("foot").textContent=T.foot;
  var qsLang=lang==="en"?"?lang=en":"";
  $("backLink").href="/"+qsLang;
  $("joinCta").href="/"+qsLang;

  var lb=document.querySelector(".lang");
  [].forEach.call(lb.querySelectorAll("button"),function(b){b.classList.toggle("on",b.getAttribute("data-l")===lang);});
  lb.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");if(!b)return;var l=b.getAttribute("data-l");if(l===lang)return;try{localStorage.setItem("thlang",l);}catch(e){}location.reload();});

  function refsWord(n){return n===1?T.ref1:T.refN;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

  if(ref){
    $("youCard").style.display="block";
    var link=SITE+"/?ref="+encodeURIComponent(ref);
    var msg=T.shareMsg+" "+link;
    $("youLink").value=link;
    var shareBtn=$("shareBtn"),copyBtn=$("copyBtn"),hint=$("shareHint");
    var waBtn=$("waBtn"),smsBtn=$("smsBtn"),mailBtn=$("mailBtn");
    waBtn.href="https://wa.me/?text="+encodeURIComponent(msg);
    smsBtn.href="sms:?&body="+encodeURIComponent(msg);
    mailBtn.href="mailto:?subject="+encodeURIComponent(T.mailSubj)+"&body="+encodeURIComponent(msg);

    // sending the link once credits +1 on the board (server-side one-time, can't be farmed).
    var credited=false;
    function credit(){
      hint.textContent=T.shared;
      shareBtn.classList.add("done");
      if(credited)return; credited=true;
      rpc("register_share",{code:ref}).then(function(){load();},function(){load();});
    }
    function doCopy(){
      var done=function(){copyBtn.textContent=T.copied;copyBtn.classList.add("copied");setTimeout(function(){copyBtn.textContent=T.copy;copyBtn.classList.remove("copied");},1600);};
      function fb(){var i=$("youLink");i.focus();i.select();try{document.execCommand("copy");done();}catch(e){}}
      try{navigator.clipboard.writeText(link).then(done,fb);}catch(e){fb();}
    }
    // primary: native OS share sheet (Apple/Android); desktop without it -> copy
    shareBtn.addEventListener("click",function(){
      if(navigator.share){
        navigator.share({title:"Tablehopp",text:T.shareMsg,url:link}).then(credit,function(){});
      } else { doCopy(); }
    });
    // opening a channel counts as sending
    [waBtn,smsBtn,mailBtn].forEach(function(a){ a.addEventListener("click",credit); });
    copyBtn.addEventListener("click",doCopy);
  } else { $("joinCta").style.display="block"; }

  function rpc(fn,body){
    return fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",
      headers:{"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,"Content-Type":"application/json"},
      body:JSON.stringify(body||{})}).then(function(r){return r.ok?r.json():null;});
  }

  var myRank=0;
  function renderBoard(rows){
    var ol=$("board");
    if(!rows||!rows.length){ ol.innerHTML='<li class="empty">'+T.empty+'</li>'; return; }
    var html="";
    rows.forEach(function(row){
      var r=+row.rank, n=+row.referrals, mine=(myRank&&r===myRank);
      html+='<li class="'+(mine?"me":"")+'">'
        +'<span class="rk'+(r<=3?" top":"")+'">'+(r<10?("0"+r):r)+'</span>'
        +'<span class="nm">'+esc(row.handle||"")+(mine?' <em>'+T.me+'</em>':"")+'</span>'
        +'<span class="ct">'+n+'<span>'+refsWord(n)+'</span></span>'
        +'</li>';
    });
    ol.innerHTML=html;
  }
  function renderYou(rank,refsN,total){
    if(!ref)return;
    $("youRank").textContent=rank?("#"+rank):"—";
    $("youBig").textContent=refsN+" "+refsWord(refsN);
    $("youSmall").textContent=rank?T.rankline(rank,total):T.norank;
    myRank=rank||0;
  }
  function stamp(){
    try{var d=new Date();var p=function(x){return (x<10?"0":"")+x;};
      $("updated").textContent=T.updated+" "+p(d.getHours())+":"+p(d.getMinutes());}catch(e){}
  }
  function load(){
    var jobs=[rpc("get_leaderboard",{top_n:10})];
    if(ref)jobs.push(rpc("get_referral_rank",{code:ref}));
    Promise.all(jobs).then(function(res){
      if(ref){var me=res[1]&&res[1][0];if(me)renderYou(me.rank?+me.rank:0,+me.referrals||0,+me.total_referrers||0);else renderYou(0,0,0);}
      if(res[0]===null){ $("board").innerHTML='<li class="empty">'+T.err+'</li>'; return; }
      renderBoard(res[0]); stamp();
    }).catch(function(){ $("board").innerHTML='<li class="empty">'+T.err+'</li>'; });
  }

  load();
  setInterval(function(){ if(!document.hidden) load(); },12000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
})();
</script>
</body>
</html>
